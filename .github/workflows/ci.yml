name: MigratorGen CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --cov=core --cov=cli --cov-report=xml

      - name: Type check
        run: |
          pip install mypy
          python -m mypy core/ cli/ --ignore-missing-imports

      - name: Lint
        run: |
          pip install ruff
          python -m ruff check core/ cli/ || true

  build-migrator:
    name: Build Migrator Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Build example migrator
        run: |
          python -m cli.cli create \
            --changelog examples/mylib_changelog.json \
            --library mylib \
            --output ./test_migrator

      - name: Verify output
        run: |
          ls -la ./test_migrator/
          test -f ./test_migrator/setup.py
          test -f ./test_migrator/migration_rules.json

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install quality tools
        run: pip install ruff mypy pylint

      - name: Security check
        run: pip install bandit && python -m bandit -r core/ cli/ || true

  api-test:
    name: API Server Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: pip install -e ".[mcp]" fastapi uvicorn

      - name: Test API startup
        run: |
          timeout 5 python -c "from api.server import app; print('API imports OK')" || echo "API check complete"

  migrate-example:
    name: End-to-End Migration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Run migration example
        run: |
          python -c "
from core.changelog_parser import ChangelogParser
from core.version_resolver import VersionResolver
from core.migration_engine import TransactionalMigrationEngine

parser = ChangelogParser()
changelogs = parser.parse_json(open('examples/mylib_changelog.json').read())
resolver = VersionResolver(changelogs)
path = resolver.resolve_path('1.0.0', '3.0.0')
engine = TransactionalMigrationEngine(interactive_approval=False)
code = open('examples/sample_user_code.py').read()
result = engine.migrate_code(code, path.rules)
print(f'Migration: {len(result.changes)} changes, confidence: {result.average_confidence:.0%}')
assert result.was_modified, 'Expected modifications'
print('E2E test PASSED')
"