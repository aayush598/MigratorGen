name: CI

on:
  push:
    branches: [main, develop, '**']
  pull_request:
    branches: [main, develop, '**']
  schedule:
    - cron: '0 2 * * 1'

env:
  PYTHON_VERSION: '3.14'
  DOCKER_BUILDKIT: 1
  CODECOV_FLAG: GHA

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check backend/ mcp/ sdk/ tests/

      - name: Check ruff format
        run: ruff format --check backend/ mcp/ sdk/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install mypy
          pip install -e .

      - name: Run mypy
        run: mypy backend/ mcp/ tests/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache virtual environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r requirements.txt 2>/dev/null || true

      - name: Run pytest with coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          source .venv/bin/activate
          pytest --cov=. --cov-report=xml --cov-fail-under=80 tests/

      - name: Run pytest from pyproject.toml config
        run: |
          source .venv/bin/activate
          pytest

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -r backend/ mcp/ -f json -o bandit-report.json

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CRATES_TOKEN }}

      - name: Build and push migration-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/migration-api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/migration-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migration-worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/migration-worker:${{ github.sha }}
            ghcr.io/${{ github.repository }}/migration-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migration-nginx
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.nginx
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/migration-nginx:${{ github.sha }}
            ghcr.io/${{ github.repository }}/migration-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
