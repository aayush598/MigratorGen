# CI Pipeline for MigratorGen
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install uv
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev,api,worker]"
      - name: Ruff check
        run: source .venv/bin/activate && ruff check cli/ mcp/ sdk/python/ backend/ shared/ tests/
      - name: Ruff format check
        run: source .venv/bin/activate && ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install uv
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev,api,worker]"
      - name: Mypy
        run: source .venv/bin/activate && mypy cli/ mcp/ sdk/python/ backend/ tests/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: migrator_user
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: migrator_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install uv
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev,api,worker]"
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://migrator_user:test-password@localhost:5432/migrator_test
          REDIS_URL: redis://localhost:6379/0
        run: source .venv/bin/activate && python -m pytest tests/ -v --tb=short -x

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install uv
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]" bandit
      - name: Bandit security scan
        run: source .venv/bin/activate && bandit -r backend/ mcp/ shared/ -f json -o bandit-report.json || true
      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api -t migrator-gen-api .
      - name: Build Worker image
        run: docker build -f infra/docker/Dockerfile -t migrator-gen-worker .
