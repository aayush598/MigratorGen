name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/security.yml'

env:
  DEPLOY_USER: deploy
  SERVER_HOST: ${{ secrets.DEPLOY_HOST }}

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/migrator-platform
            git pull origin main
            docker compose -f infra/docker/docker-compose.yml pull
            docker compose -f infra/docker/docker-compose.yml up -d --no-deps api worker
            docker image prune -f

      - name: Smoke test staging
        run: |
          sleep 10
          curl -f https://staging.migratorgen.example.com/health || exit 1
          curl -f https://staging.migratorgen.example.com/api/v1/health || exit 1

      - name: Notify Slack on staging success
        if: success()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {"text": "✅ Staging deployment successful for commit <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on staging failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {"text": "❌ Staging deployment failed for commit <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Run API smoke tests
        run: |
          API_URL=${API_URL:-http://localhost:8000}
          curl -f "${API_URL}/health" || exit 1
          curl -f "${API_URL}/api/v1/health" || exit 1

      - name: Run migration smoke tests
        run: |
          python -m pytest tests/smoke/ -v --tb=short

  deploy-production:
    runs-on: ubuntu-latest
    needs: smoke-test
    environment:
      name: production
      url: https://app.migratorgen.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/migrator-platform
            git pull origin main
            docker compose -f infra/docker/docker-compose.yml pull
            docker compose -f infra/docker/docker-compose.yml up -d --no-deps api worker scheduler
            docker image prune -f

      - name: Verify production deployment
        run: |
          sleep 15
          curl -f https://app.migratorgen.example.com/health || exit 1
          curl -f https://app.migratorgen.example.com/api/v1/health || exit 1

      - name: Notify Slack on production success
        if: success()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {"text": "✅ Production deployment successful for commit <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on production failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {"text": "❌ Production deployment failed for commit <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
