name: Security Scan

on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
  schedule:
    - cron: '0 2 * * 1'

jobs:
  bandit-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install -e ".[dev]"

      - name: Run Bandit
        run: |
          bandit -r backend/ mcp/ -f screen --confidence-level high --severity-level medium

      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: bandit_report.json
          retention-days: 30

  safety-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install -e ".[dev]"

      - name: Run Safety
        run: safety check --json-file-path=safety_report.json || true

      - name: Upload Safety results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-results
          path: safety_report.json
          retention-days: 30

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --format=json --output-file=pip_audit_report.json || true

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: pip_audit_report.json
          retention-days: 30

  security-summary:
    runs-on: ubuntu-latest
    needs: [bandit-scan, safety-scan, dependency-check]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Security scan completed"
          echo "Bandit: ${{ needs.bandit-scan.result }}"
          echo "Safety: ${{ needs.safety-scan.result }}"
          echo "pip-audit: ${{ needs.dependency-check.result }}"

      - name: Notify on critical findings
        if: needs.bandit-scan.result == 'success' && needs.dependency-check.result == 'success'
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {"text": "🔒 Security scan completed - all checks passed"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
