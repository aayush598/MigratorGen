[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "migrator-gen-cli"
version = "0.2.0"
description = "MigratorGen CLI — automated Python code migration tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "MigratorGen", email = "dev@migrator-gen.io"},
]
keywords = ["migrator-gen", "migration", "codemod", "cli", "libcst", "ast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    "migrator-gen>=0.2.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/migrator-gen/migrator-gen"
Repository = "https://github.com/migrator-gen/migrator-gen"
Documentation = "https://migrator-gen.readthedocs.io"

[project.scripts]
migrator-gen = "cli.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
lint.ignore = ["E501"]
lint.per-file-ignores = {"__init__.py" = ["F401"]}

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
