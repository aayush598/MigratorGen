global:
  resolve_timeout: 5m
  http_config:
    tls_config:
      insecure_skip_verify: false
  smtp_hello: localhost
  smtp_from: alertmanager@example.com
  smtp_auth_username: alertmanager
  smtp_auth_password: password

route:
  receiver: 'slack-critical'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: 'slack-critical'
      continue: true
    - match:
        severity: warning
      receiver: 'email-warning'
    - match:
        severity: info
      receiver: 'null'

receivers:
  - name: 'slack-critical'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/PLACEHOLDER/WEBHOOK/URL'
        channel: '#alerts'
        send_resolved: true
        title: |
          {{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}
        text: |
          {{ range .Alerts }}
          **{{ .Labels.severity | toUpper }}**: {{ .Annotations.summary }}
          {{ if .Annotations.description }}Description: {{ .Annotations.description }}{{ end }}
          {{ if .Annotations.runbook_url }}Runbook: {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}
        color: |
          {{ if eq .Status "firing" }}
            {{ if eq .CommonLabels.severity "critical" }}#FF0000{{ else }}#FFA500{{ end }}
          {{ else }}#00FF00{{ end }}
        footer: 'MigratorGen AlertManager'
        icon_emoji: ':warning:'

  - name: 'email-warning'
    email_configs:
      - to: 'alerts@example.com'
        send_resolved: true
        headers:
          subject: '[Warning] MigratorGen Alert - {{ .GroupLabels.alertname }}'

  - name: 'email-critical'
    email_configs:
      - to: 'alerts@example.com'
        send_resolved: true
        headers:
          subject: '[CRITICAL] MigratorGen Alert - {{ .GroupLabels.alertname }}'
        html: |
          <h1>{{ .Status | toUpper }} - {{ .GroupLabels.alertname }}</h1>
          {{ range .Alerts }}
          <h2>{{ .Labels.severity | toUpper }}</h2>
          <p>{{ .Annotations.description }}</p>
          {{ end }}

  - name: 'null'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  - source_match:
      severity: 'critical'
    target_match:
      severity: 'info'
    equal: ['alertname', 'instance']

  - source_match:
      alertname: 'HighErrorRate'
    target_match:
      alertname: 'ServiceDown'
    equal: ['instance']
