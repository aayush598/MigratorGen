global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'migrator_platform'
    environment: 'production'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'migration-api'
    static_configs:
      - targets: ['migration-api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'migration-worker'
    static_configs:
      - targets: ['migration-worker:8001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    metrics_path: '/metrics'