apiVersion: v1
kind: ConfigMap
metadata:
  name: migratorgen-config
  namespace: default
  labels:
    app: migratorgen
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  WORKER_CONCURRENCY: "4"
  MAX_FILE_SIZE_MB: "10"
  ALLOWED_EXTENSIONS: "py,txt,pyi"
  REDIS_CACHE_TTL: "3600"
  API_RATE_LIMIT: "100/minute"
  LLM_PROVIDER: "anthropic"
  LLM_MODEL: "claude-sonnet-4-20250514"
  CELERY_WORKER_CONCURRENCY: "4"
  PARALLEL_MAX_WORKERS: "4"