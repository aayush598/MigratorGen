apiVersion: v1
kind: ConfigMap
metadata:
  name: migrator-config
  namespace: migrator-platform
  labels:
    app: migrator-platform
    component: config
data:
  LOG_LEVEL: "INFO"
  WORKER_CONCURRENCY: "4"
  MAX_FILE_SIZE_MB: "10"
  ALLOWED_EXTENSIONS: "py,txt"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
---
apiVersion: v1
kind: Secret
metadata:
  name: migrator-secrets
  namespace: migrator-platform
  labels:
    app: migrator-platform
    component: secrets
type: Opaque
stringData:
  DB_PASSWORD: "REPLACE_WITH_SECURE_PASSWORD"
  REDIS_PASSWORD: "REPLACE_WITH_SECURE_PASSWORD"
  API_KEY: "REPLACE_WITH_SECURE_API_KEY"
  GRAFANA_PASSWORD: "REPLACE_WITH_SECURE_PASSWORD"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: migrator-api
  namespace: migrator-platform
  labels:
    app: migrator-platform
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: migrator-platform
      component: api
  template:
    metadata:
      labels:
        app: migrator-platform
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: migrator-platform-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: migrator-config
            - secretRef:
                name: migrator-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: migrator-secrets
                  key: DB_PASSWORD
                  optional: false
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: component
                      operator: In
                      values: [api]
                topologyKey: kubernetes.io/hostname
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: migrator-worker
  namespace: migrator-platform
  labels:
    app: migrator-platform
    component: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: migrator-platform
      component: worker
  template:
    metadata:
      labels:
        app: migrator-platform
        component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: worker
          image: migrator-platform-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: migrator-config
            - secretRef:
                name: migrator-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: migrator-secrets
                  key: DB_PASSWORD
                  optional: false
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: component
                      operator: In
                      values: [worker]
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: migrator-api
  namespace: migrator-platform
  labels:
    app: migrator-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app: migrator-platform
    component: api
---
apiVersion: v1
kind: Service
metadata:
  name: migrator-worker
  namespace: migrator-platform
  labels:
    app: migrator-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8001
      targetPort: http
      protocol: TCP
  selector:
    app: migrator-platform
    component: worker
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: migrator-ingress
  namespace: migrator-platform
  labels:
    app: migrator-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10M"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "75"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: migration.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: migrator-api
                port:
                  number: 8000
          - path: /worker
            pathType: Prefix
            backend:
              service:
                name: migrator-worker
                port:
                  number: 8001
  tls:
    - hosts:
        - migration.example.com
      secretName: migrator-tls-secret
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: migrator-api-hpa
  namespace: migrator-platform
  labels:
    app: migrator-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: migrator-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: migrator-worker-hpa
  namespace: migrator-platform
  labels:
    app: migrator-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: migrator-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max