[project]
name = "migrators-shared"
version = "0.1.0"
description = "Shared utilities for MigratorGen platform (logging, exceptions, metrics, cache, database)"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "MigratorGen Team", email = "dev@migratorgen.example.com"},
]
keywords = ["migratorgen", "migration", "libcst", "ast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "structlog>=24.0",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.0",
    "prometheus-client>=0.19",
    "python-json-logger>=2.0",
    "sentry-sdk>=2.0",
    "slowapi>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "mypy>=1.8",
    "bandit>=1.7",
]
redis-cluster = ["redis[hiredis]>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]

[tool.hatch]
build.targets.wheel.packages = ["src/shared"]