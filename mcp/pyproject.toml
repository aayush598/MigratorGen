[project]
name = "migrator-gen-mcp"
version = "0.2.0"
description = "MCP server for migrator-gen — AI-assisted code migration via Model Context Protocol"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MigratorGen", email = "dev@migrator-gen.dev"},
]
keywords = ["mcp", "migration", "codemod", "refactoring", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "migrator-gen>=0.2.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "httpx>=0.25",
]
http = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
]
all = [
    "mcp>=1.0.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[project.urls]
Homepage = "https://github.com/migrator-gen/migrator-gen"
Repository = "https://github.com/migrator-gen/migrator-gen"
Documentation = "https://migrator-gen.readthedocs.io"

[project.scripts]
migrator-gen-mcp = "migrator_gen_mcp.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["migrator_gen_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["mcp"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
