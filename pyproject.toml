[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "migrator-gen-workspace"
version = "0.1.0"
description = "Monorepo workspace for the MigratorGen migration platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "MigratorGen", email = "aayush@migrator-gen.dev"}
]
keywords = ["codemod", "migration", "refactoring", "upgrade", "changelog", "tooling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python",
]

dependencies = [
    "libcst>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.5.0",
    "rich>=13.0.0",
]
mcp = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "prometheus-client>=0.19.0",
]
worker = [
    "celery>=5.3.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
]
all = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "prometheus-client>=0.19.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
]

[project.scripts]
migrator-gen = "cli.cli.app:main"
migrator-gen-mcp = "migrator_gen_mcp.server.app:main"
migrator-gen-api = "backend.api.src.server:main"

[project.urls]
Homepage = "https://github.com/migrator-gen/migrator-gen"
Repository = "https://github.com/migrator-gen/migrator-gen"
Documentation = "https://migrator-gen.readthedocs.io"
Changelog = "https://github.com/migrator-gen/migrator-gen/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["cli/src", "mcp/src", "shared", "backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["sdk/python/examples/**", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]
extend-ignore = ["N802", "B904", "B017", "E402"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"backend/api/src/server.py" = ["B008"]

[tool.bandit]
skips = ["B101", "B104"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    'mcp/tests/',
    'cli/tests/',
    'sdk/python/examples/',
]
