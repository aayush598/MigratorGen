[project]
name = "migrator-gen"
version = "0.2.0"
description = "Python SDK for MigratorGen — migrate Python code across library versions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MigratorGen Team", email = "dev@migrator-gen.io"},
]
keywords = ["migrator-gen", "migration", "codemod", "codemodder", "libcst", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
local = [
    "libcst>=1.0.0",
]
remote = [
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
]
all = [
    "migrator-gen[local,remote]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.urls]
Homepage = "https://github.com/migrator-gen/migrator-gen"
Repository = "https://github.com/migrator-gen/migrator-gen"
Documentation = "https://migrator-gen.readthedocs.io"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["migrator_gen"]
